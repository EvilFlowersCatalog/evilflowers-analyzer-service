# Local development: Redis and the worker of this image. The catalog and the downstream services (text, image,
# equation) run from their own repos and point at this Redis; STORAGE_PATH must be the same directory they read and
# write (./data here). Docling's layout model is downloaded into ./models on the first task.
#
#   docker compose up --build

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"

  analyzer:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379/7
      STORAGE_PATH: /mnt/data
      LOG_FORMAT: text
    volumes:
      - ./data:/mnt/data
      - ./models:/models
    depends_on:
      - redis
