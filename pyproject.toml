[project]
name = "evilflowers-analyzer-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: entry point of an IP-018 extraction run (one Docling layout pass, fan-out)"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.6,<6",
    "docling>=2.30",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.6,<3",
    # 2.x hard-depends on onnxruntime and a layout model; the analyzer reads page sizes only.
    "pymupdf>=1.26,<2",
    "python-dotenv>=1.0",
    "requests>=2.32",
    # Docling's layout model; CPU wheels only (see [tool.uv.sources]).
    "torch>=2.4",
    "torchvision>=0.19",
    # IP-019: code uses the API only, a no-op without the `otel` extra. One release train with the catalog.
    "opentelemetry-api==1.45.2",
]

[project.optional-dependencies]
# OTLP/HTTP to the node's Alloy; SDK/exporter 1.x and contrib 0.yb0 move together (as in the catalog).
otel = [
    "opentelemetry-sdk==1.45.2",
    "opentelemetry-exporter-otlp-proto-http==1.45.2",
    "opentelemetry-instrumentation-celery==0.66b2",
    "opentelemetry-instrumentation-requests==0.66b2",
    "opentelemetry-instrumentation-system-metrics==0.66b2",
]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = [
    "pyroscope-io==1.4.0",
    "pyroscope-otel==1.1.0",
]

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_analyzer"]

# The default PyPI torch is the CUDA build (several GB); the worker runs on CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_analyzer"]
