[project]
name = "evilflowers-analyzer-service"
version = "1.0.0"
description = "Celery worker of the EvilFlowers catalog: entry point of an IP-018 extraction run (one Docling layout pass, fan-out)"
readme = "README.md"
authors = [{ name = "Jakub Dubec", email = "jakub.dubec@stuba.sk" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    # The worker runtime: contract, catalog client, Celery delivery semantics, observability.
    # https://github.com/EvilFlowersCatalog/evilflowers-worker, pinned to a commit in [tool.uv.sources].
    "evilflowers-worker",
    "docling>=2.30",
    # 2.x hard-depends on onnxruntime and a layout model; the analyzer reads page sizes and text only.
    "pymupdf>=1.26,<2",
    # Paints a leaf's mask white on a private copy before layout (standalone.layout, #8); Docling depends on it too.
    "pillow>=10",
    # Docling's layout model; CPU wheels only (see [tool.uv.sources]).
    "torch>=2.4",
    "torchvision>=0.19",
]

[project.optional-dependencies]
# OTLP/HTTP to the node's Alloy (the kit's SDK pins).
otel = ["evilflowers-worker[otel]"]
# Pyroscope SDK: Python frames the node's eBPF profiler cannot unwind; on only with PYROSCOPE_SERVER_ADDRESS.
profiling = ["evilflowers-worker[profiling]"]

[dependency-groups]
# `uv sync` installs the core and this group only.
dev = [
    "opentelemetry-sdk==1.45.2",
    "pytest>=8.3",
    "pytest-cov>=6",
    "mypy>=1.15",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evilflowers_analyzer"]

# The default PyPI torch is the CUDA build (several GB); the worker runs on CPU.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]
# The shared worker kit (its docs/architecture.md §5). Bump `rev` to take a fix; every service pins its own.
evilflowers-worker = { git = "https://github.com/EvilFlowersCatalog/evilflowers-worker", rev = "e563998b9c2f19f0d60cb75e0153fd40f417e84a" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]

[tool.ruff]
line-length = 119
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["evilflowers_analyzer", "evilflowers_worker"]

[tool.mypy]
python_version = "3.12"
files = ["src/evilflowers_analyzer"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
# Celery, kombu, docling and pyroscope ship no type information.
ignore_missing_imports = true

[tool.coverage.run]
source = ["evilflowers_analyzer"]
branch = true
